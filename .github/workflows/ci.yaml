name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  integration:
    needs: [check, secrets]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # match your local major version: `psql --version`
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unosteve_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/unosteve_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command dbmate --url "$TEST_DATABASE_URL" up
      - run: nix develop --command cabal test --test-show-details=direct --test-options=--fail-on=pending

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so every commit is scanned
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#gitleaks -- git . --redact --log-opts="origin/main..HEAD"
